[project]
name = "gcp-orchestration"
version = "0.1.0"
description = "GCP Orchestration Platform — visual infrastructure design to running cloud"
requires-python = ">=3.12"
dependencies = [
    "gcp-orchestration-core",
    "gcp-orchestration-platform",
    "gcp-orchestration-api",
    "gcp-orchestration-mcp",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]

[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "packages/platform/tests",
    "packages/api/tests",
    "packages/mcp/tests",
]
markers = ["integration: requires GCP credentials and network"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

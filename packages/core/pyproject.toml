[project]
name = "gcp-orchestration-core"
version = "0.1.0"
description = "Pure infrastructure layer — schemas, Terraform generation, DAG, validation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
